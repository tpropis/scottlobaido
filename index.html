<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scott LoBaido — American Artist</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    /* ── STAGE ── */
    .hero {
      position: relative;
      width: 100vw; height: 100vh;
      height: 100dvh; /* iOS Chrome: dynamic viewport excludes browser chrome */
      overflow: hidden;
      background: #000;
      isolation: isolate; /* scope mix-blend-mode to this context */
    }

    /* ── FLAG — oversized + tilted for cinematic drama ── */
    .flag-wrap {
      position: absolute; inset: 0;
      transform: scale(1.08) rotate(-1.3deg);
      transform-origin: 54% 50%;
    }
    .flag-svg { width: 100%; height: 100%; }

    /*
      ── LINEN CANVAS TEXTURE ──
      Multiplied over the flag so the painted stripes feel like
      they sit ON physical canvas, not on a screen.
      mix-blend-mode:multiply means: where the linen is dark the
      paint looks shadowed; where it's light the paint stays bright.
      On the black background areas it has no effect (black × anything = black).
    */
    #canvas-tex {
      position: absolute; inset: 0;
      z-index: 1;
      mix-blend-mode: multiply;
      opacity: 0.42;
      background-repeat: repeat;
      background-size: 512px 512px;
      pointer-events: none;
    }

    /* ── CINEMATIC VIGNETTE ── */
    .vignette {
      position: absolute; inset: 0;
      background:
        radial-gradient(
          ellipse 80% 100% at 58% 50%,
          transparent 5%,
          rgba(0,0,0,0.40) 55%,
          rgba(0,0,0,0.82) 100%
        ),
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.48) 0%,
          transparent 22%,
          transparent 72%,
          rgba(0,0,0,0.68) 100%
        );
      z-index: 2;
      pointer-events: none;
    }

    /* ── FILM GRAIN ── */
    #grain {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      opacity: 0;
      z-index: 8;
      pointer-events: none;
      mix-blend-mode: overlay;
      background-repeat: repeat;
      background-size: 256px 256px;
      transition: opacity 2.5s ease;
      animation: grain-shift 0.13s steps(1) infinite;
    }
    @keyframes grain-shift {
      0%   { background-position:   0px   0px; }
      14%  { background-position: -35px  48px; }
      28%  { background-position:  52px -30px; }
      42%  { background-position: -22px  65px; }
      57%  { background-position:  45px -48px; }
      71%  { background-position: -60px  24px; }
      85%  { background-position:  28px -58px; }
    }

    /* ── PORTRAIT ── */
    .portrait {
      position: absolute;
      right: 5%; bottom: 0;
      height: 90vh; max-height: 960px;
      width: auto;
      opacity: 0;
      z-index: 5;
      filter:
        drop-shadow(-35px  0px 55px rgba(0,0,0,0.96))
        drop-shadow( -8px  0px 18px rgba(178,34,52,0.12));
      /* Fade legs into black — prevents hard clip at bottom on any viewport */
      -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 88%);
      mask-image:         linear-gradient(to bottom, black 50%, transparent 88%);
      transition: opacity 2.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── LOGO ── */
    .logo {
      position: absolute;
      left: 5%; bottom: 8%;
      width: clamp(210px, 27vw, 350px);
      opacity: 0;
      z-index: 6;
      filter: drop-shadow(0 0 35px rgba(0,0,0,1));
      transition: opacity 2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── MOBILE ── */
    @media (max-width: 680px) {
      .flag-wrap { transform: scale(1.1) rotate(-1.3deg); }
      .portrait {
        right: 50%; transform: translateX(50%);
        height: 70vh; bottom: 22vh;
        filter: drop-shadow(0 0 40px rgba(0,0,0,0.9));
      }
      .logo {
        left: 50%; bottom: 4%;
        transform: translateX(-50%);
        width: clamp(180px, 72vw, 300px);
      }
    }
  </style>
</head>
<body>

<div class="hero">

  <!-- ═══════════════════════════════════════════════════════
       FLAG SVG
       All animation is driven by the script below.
       Stripes are revealed via animated SVG masks (not clip-path)
       so the leading edge can be rough/brush-like.
  ═══════════════════════════════════════════════════════ -->
  <div class="flag-wrap">
    <svg id="flag" class="flag-svg"
         viewBox="0 0 1900 1000"
         preserveAspectRatio="xMidYMid slice"
         xmlns="http://www.w3.org/2000/svg">
      <defs>

        <!--
          ── PAINTED TEXTURE: RED STRIPES ──

          Filter chain:
            1. feTurbulence  → fractal noise with long horizontal character
                               (low x-freq = long brushstrokes, med y-freq = pressure variation)
            2. feComposite arithmetic → modulates stripe color by noise:
                               output = src × (k1×noise + k2)
                               k1=0.38, k2=0.62 → brightness range 62–100%
                               simulates thick vs thin paint (impasto pressure variation)
            3. feDisplacementMap → scale=34: ragged, torn edges top+bottom
                               at up to ±34 SVG units (~44% of stripe height)
            4. feComposite in → clips displaced result back to original stripe bounds
        -->
        <filter id="tex-r"
                x="-2%" y="-48%"
                width="104%" height="196%"
                color-interpolation-filters="linearRGB">
          <feTurbulence type="fractalNoise"
                        baseFrequency="0.007 0.052"
                        numOctaves="5" seed="3" result="noise"/>
          <feComposite in="SourceGraphic" in2="noise"
                       operator="arithmetic"
                       k1="0.38" k2="0.62" k3="0" k4="0"
                       result="textured"/>
          <feDisplacementMap in="textured" in2="noise"
                             scale="34"
                             xChannelSelector="R" yChannelSelector="G"
                             result="displaced"/>
          <feComposite in="displaced" in2="SourceGraphic" operator="in"/>
        </filter>

        <!--
          ── PAINTED TEXTURE: CREAM STRIPES ──
          Lighter touch — less variation and displacement than the red.
          Cream paint applied more evenly (thinner brush load).
        -->
        <filter id="tex-w"
                x="-2%" y="-48%"
                width="104%" height="196%"
                color-interpolation-filters="linearRGB">
          <feTurbulence type="fractalNoise"
                        baseFrequency="0.007 0.052"
                        numOctaves="5" seed="9" result="noise"/>
          <feComposite in="SourceGraphic" in2="noise"
                       operator="arithmetic"
                       k1="0.22" k2="0.78" k3="0" k4="0"
                       result="textured"/>
          <feDisplacementMap in="textured" in2="noise"
                             scale="19"
                             xChannelSelector="R" yChannelSelector="G"
                             result="displaced"/>
          <feComposite in="displaced" in2="SourceGraphic" operator="in"/>
        </filter>

        <!--
          ── BRUSH-TIP FILTER (used on desktop/non-iOS only) ──
          Applied to a single mask rect per stripe. Displaces the rect's
          right edge into a jagged bristle silhouette as it sweeps left→right.
          · type="turbulence" → sharper, more organic bristle shapes than fractalNoise
          · baseFrequency: 0.006 x (long horizontal waves), 0.38 y (bristle separation)
          · scale=78: ±39 SVG units of tip displacement
          NOTE: WebKit on iOS silently fails filter-inside-mask (mask goes fully black).
          The JS below detects iOS and uses the multi-band fallback instead.
        -->
        <filter id="brush-tip"
                x="-5%" y="-55%"
                width="115%" height="210%"
                color-interpolation-filters="linearRGB">
          <feTurbulence type="turbulence"
                        baseFrequency="0.006 0.38"
                        numOctaves="3" seed="42" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise"
                             scale="78"
                             xChannelSelector="R" yChannelSelector="G"/>
        </filter>

      </defs>

      <!--
        ── 13 STRIPES ──
        Exact y = i × (1000/13). Height = (1000/13) + 2 for overlap
        to close any hairline gaps between adjacent stripes.
        The final stripe uses exact height so the flag ends cleanly at y=1000.

        Masks are created and animated by the script.
        No clip-path is set here.
      -->
      <rect id="s0"  x="0" y="0"       width="1900" height="78.923" fill="#B22234" filter="url(#tex-r)"/>
      <rect id="s1"  x="0" y="76.923"  width="1900" height="78.923" fill="#EDE5CC" filter="url(#tex-w)"/>
      <rect id="s2"  x="0" y="153.846" width="1900" height="78.923" fill="#B22234" filter="url(#tex-r)"/>
      <rect id="s3"  x="0" y="230.769" width="1900" height="78.923" fill="#EDE5CC" filter="url(#tex-w)"/>
      <rect id="s4"  x="0" y="307.692" width="1900" height="78.923" fill="#B22234" filter="url(#tex-r)"/>
      <rect id="s5"  x="0" y="384.615" width="1900" height="78.923" fill="#EDE5CC" filter="url(#tex-w)"/>
      <rect id="s6"  x="0" y="461.538" width="1900" height="78.923" fill="#B22234" filter="url(#tex-r)"/>
      <rect id="s7"  x="0" y="538.462" width="1900" height="78.923" fill="#EDE5CC" filter="url(#tex-w)"/>
      <rect id="s8"  x="0" y="615.385" width="1900" height="78.923" fill="#B22234" filter="url(#tex-r)"/>
      <rect id="s9"  x="0" y="692.308" width="1900" height="78.923" fill="#EDE5CC" filter="url(#tex-w)"/>
      <rect id="s10" x="0" y="769.231" width="1900" height="78.923" fill="#B22234" filter="url(#tex-r)"/>
      <rect id="s11" x="0" y="846.154" width="1900" height="78.923" fill="#EDE5CC" filter="url(#tex-w)"/>
      <rect id="s12" x="0" y="923.077" width="1900" height="76.923" fill="#B22234" filter="url(#tex-r)"/>

      <!--
        ── CANTON ──
        Exactly 7 stripes tall (7 × 1000/13 = 538.462) × 2/5 flag wide (760).
        Starts transparent; fades in after stripes complete.
      -->
      <rect id="canton"
            x="0" y="0" width="760" height="538.462"
            fill="#3C3B6E" opacity="0"/>

      <!-- 50 STARS — generated and positioned by script -->
      <g id="stars"></g>

    </svg>
  </div>

  <!-- Linen canvas texture multiplied over the flag -->
  <div id="canvas-tex"></div>

  <!-- Vignette -->
  <div class="vignette"></div>

  <!-- Film grain -->
  <div id="grain"></div>

  <!-- Portrait -->
  <img class="portrait" id="portrait" src="scott.png" alt="Scott LoBaido" />

  <!-- Logo -->
  <img class="logo" id="logo" src="logo.png" alt="American Artist Scott LoBaido" />

</div>

<script>
(function () {
  'use strict';

  var SVG_NS   = 'http://www.w3.org/2000/svg';
  var CANTON_W = 760;
  var CANTON_H = 7 * (1000 / 13);   // 538.4615...
  var FLAG_W   = 1900;

  /* ══════════════════════════════════════════════════════════════════
     LINEN CANVAS TEXTURE
     Generates a 512×512 warm-tan linen weave in JS and applies it
     to #canvas-tex via background-image. The div uses
     mix-blend-mode:multiply, so this darkens the paint where the
     canvas threads are shadowed — giving the flag a physical,
     painted-on-canvas feel rather than a digital flat look.
  ══════════════════════════════════════════════════════════════════ */
  (function buildLinen() {
    var W = 512, H = 512;
    var c   = document.createElement('canvas');
    c.width = W; c.height = H;
    var ctx = c.getContext('2d');
    var id  = ctx.createImageData(W, H);
    var d   = id.data;

    for (var y = 0; y < H; y++) {
      for (var x = 0; x < W; x++) {
        var i = (y * W + x) * 4;

        // Horizontal linen threads — period ~9px (tightly woven)
        var horiz = Math.sin(y / 4.5 * Math.PI) * 0.5 + 0.5;

        // Vertical threads — period ~13px (slightly coarser)
        var vert  = Math.sin(x / 6.5 * Math.PI) * 0.5 + 0.5;

        // Slow large-scale canvas tension undulation
        var bump  = Math.sin(x / 90 * Math.PI) * Math.cos(y / 70 * Math.PI) * 0.5 + 0.5;

        // Fine random fibre grain
        var grain = Math.random();

        // Combine — thread pattern dominates
        var val = horiz * 0.38 + vert * 0.22 + bump * 0.22 + grain * 0.18;

        // Warm tan palette: R 138–220, G 118–196, B 88–156
        d[i]     = Math.min(255, (138 + val * 82)  | 0);
        d[i + 1] = Math.min(255, (118 + val * 78)  | 0);
        d[i + 2] = Math.min(255, ( 88 + val * 68)  | 0);
        d[i + 3] = 255;
      }
    }

    ctx.putImageData(id, 0, 0);
    document.getElementById('canvas-tex').style.backgroundImage =
      'url(' + c.toDataURL() + ')';
  })();

  /* ══════════════════════════════════════════════════════════════════
     FILM GRAIN
  ══════════════════════════════════════════════════════════════════ */
  (function buildGrain() {
    var SIZE = 256;
    var c   = document.createElement('canvas');
    c.width = c.height = SIZE;
    var ctx = c.getContext('2d');
    var id  = ctx.createImageData(SIZE, SIZE);
    var d   = id.data;
    for (var i = 0; i < d.length; i += 4) {
      var v = (Math.random() * 255) | 0;
      d[i] = d[i+1] = d[i+2] = v;
      d[i+3] = 255;
    }
    ctx.putImageData(id, 0, 0);
    document.getElementById('grain').style.backgroundImage =
      'url(' + c.toDataURL() + ')';
  })();

  /* ══════════════════════════════════════════════════════════════════
     STAR GENERATION  (exactly 50 stars)

     The canton uses a 12-col × 10-row grid:
       GH = canton_width  / 12 = 63.333  (horizontal unit)
       GV = canton_height / 10 = 53.846  (vertical unit)

     6-star rows (0,2,4,6,8) → x = GH × {1,3,5,7,9,11}   (odd cols)
     5-star rows (1,3,5,7)   → x = GH × {2,4,6,8,10}      (even cols)
     All rows                → y = GV × (row + 1)

     5×6 + 4×5 = 30 + 20 = 50 ✓
  ══════════════════════════════════════════════════════════════════ */
  var GH     = CANTON_W / 12;
  var GV     = CANTON_H / 10;
  var STAR_R = 22;
  var SIX_X  = [1, 3, 5, 7, 9, 11];
  var FIVE_X = [2, 4, 6, 8, 10];

  function starPath(cx, cy) {
    // Filled 5-pointed star: outer radius R, inner radius R×0.382 (sin18°/sin54°)
    // 5 outer points at -90°, -18°, 54°, 126°, 198°
    // 5 inner points at -54°,  18°, 90°, 162°, 234°
    var R = STAR_R, ri = R * 0.382, d = '';
    for (var k = 0; k < 5; k++) {
      var oa = (k * 72 - 90) * (Math.PI / 180);
      var ia = (k * 72 - 54) * (Math.PI / 180);
      d += (k === 0 ? 'M' : 'L') +
           (cx + R  * Math.cos(oa)).toFixed(2) + ',' +
           (cy + R  * Math.sin(oa)).toFixed(2) + 'L' +
           (cx + ri * Math.cos(ia)).toFixed(2) + ',' +
           (cy + ri * Math.sin(ia)).toFixed(2);
    }
    return d + 'Z';
  }

  var starsGroup = document.getElementById('stars');
  var starEls    = [];

  for (var row = 0; row < 9; row++) {
    var isSix  = (row % 2 === 0);
    var xMults = isSix ? SIX_X : FIVE_X;
    var starY  = GV * (row + 1);
    for (var xi = 0; xi < xMults.length; xi++) {
      var p = document.createElementNS(SVG_NS, 'path');
      p.setAttribute('d',       starPath(GH * xMults[xi], starY));
      p.setAttribute('fill',    '#FFFFFF');
      p.setAttribute('opacity', '0');
      starsGroup.appendChild(p);
      starEls.push(p);
    }
  }

  /* ══════════════════════════════════════════════════════════════════
     BRUSH-TIP MASK ANIMATION

     Desktop / non-iOS:
       Single mask rect per stripe, with the #brush-tip SVG filter applied.
       The filter's feDisplacementMap makes the rect's right (leading) edge
       a jagged bristle silhouette as its width grows left→right.

     iOS (iPhone / iPad):
       WebKit silently fails when a `filter` attr is on a child of <mask> —
       the mask goes fully black, all stripes stay invisible, nothing animates.
       Fallback: 14 plain white band-rects per stripe. Each band's width is
       staggered by a precomputed sine-wave offset so the leading edge is
       still uneven and bristle-like, achieved geometrically instead.

     Both paths use the same rAF loop (bands array, just length 1 vs 14).
  ══════════════════════════════════════════════════════════════════ */

  // iOS detection — both Mobile Safari and Chrome on iOS use WebKit's
  // broken filter-inside-mask behavior.
  var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  var NUM_BANDS = 14;

  function bandOffsets(si) {
    var s = si + 1, result = [];
    for (var b = 0; b < NUM_BANDS; b++) {
      var t = b / (NUM_BANDS - 1);
      result.push(
        Math.sin(t * Math.PI * 2.3 + s * 1.9) * 20 +
        Math.sin(t * Math.PI * 5.7 + s * 1.1) * 11 +
        Math.sin(t * Math.PI * 1.1 + s * 3.4) *  7
      );
    }
    return result;
  }

  var svgDefs    = document.querySelector('#flag defs');
  var stripes    = [];
  var stripeBands = [];  // array of [{rect, off}, …] per stripe

  for (var si = 0; si < 13; si++) {
    stripes.push(document.getElementById('s' + si));
  }

  stripes.forEach(function (stripe, i) {
    var sy = parseFloat(stripe.getAttribute('y'));
    var sh = parseFloat(stripe.getAttribute('height'));

    var maskId = 'bm-' + i;
    var mask   = document.createElementNS(SVG_NS, 'mask');
    mask.setAttribute('id',        maskId);
    mask.setAttribute('maskUnits', 'userSpaceOnUse');

    var bands = [];

    if (isIOS) {
      // ── iOS fallback: 14 band-rects, no filter ──
      var bh   = sh / NUM_BANDS;
      var offs = bandOffsets(i);
      for (var b = 0; b < NUM_BANDS; b++) {
        var mr = document.createElementNS(SVG_NS, 'rect');
        mr.setAttribute('x',      '-100');
        mr.setAttribute('y',       String(sy + b * bh - 1));
        mr.setAttribute('width',  '0');
        mr.setAttribute('height',  String(bh + 2));
        mr.setAttribute('fill',   'white');
        mask.appendChild(mr);
        bands.push({ rect: mr, off: offs[b] });
      }
    } else {
      // ── Desktop: single rect with brush-tip filter ──
      var mr = document.createElementNS(SVG_NS, 'rect');
      mr.setAttribute('x',      '-100');
      mr.setAttribute('y',       String(sy - 50));   // extend beyond stripe top/bottom
      mr.setAttribute('width',  '0');
      mr.setAttribute('height',  String(sh + 100));  // to absorb y-displacement
      mr.setAttribute('fill',   'white');
      mr.setAttribute('filter', 'url(#brush-tip)');
      mask.appendChild(mr);
      bands.push({ rect: mr, off: 0 });
    }

    svgDefs.appendChild(mask);
    stripe.setAttribute('mask', 'url(#' + maskId + ')');
    stripeBands.push(bands);
  });

  /* ══════════════════════════════════════════════════════════════════
     TIMING  (all in milliseconds)
  ══════════════════════════════════════════════════════════════════ */
  var T_STRIPE_START   = 500;
  var T_STRIPE_STAGGER = 188;
  var T_STRIPE_DUR     = 840;   // slightly slower = deliberate brushstroke feel
  var T_CANTON_DELAY   = T_STRIPE_START + 12 * T_STRIPE_STAGGER + T_STRIPE_DUR + 120;
  var T_CANTON_DUR     = 900;
  var T_STARS_START    = T_CANTON_DELAY + 420;
  var T_STAR_STAGGER   = 42;
  var T_PORTRAIT_DELAY = T_STARS_START  + 350;
  var T_LOGO_DELAY     = T_PORTRAIT_DELAY + 820;

  /* ══════════════════════════════════════════════════════════════════
     RAF PAINT LOOP  — drives all 13 stripe mask animations
  ══════════════════════════════════════════════════════════════════ */
  var rafT0 = null;

  function paintLoop(ts) {
    if (!rafT0) rafT0 = ts;
    var elapsed  = ts - rafT0;
    var needMore = false;

    stripeBands.forEach(function (bands, i) {
      var tStart = T_STRIPE_START + i * T_STRIPE_STAGGER;
      var tEnd   = tStart + T_STRIPE_DUR;

      if (elapsed >= tEnd) {
        // Fully painted — all bands past the right edge
        bands.forEach(function (b) { b.rect.setAttribute('width', '2100'); });
        return;
      }
      if (elapsed < tStart) {
        needMore = true;
        return;
      }

      needMore  = true;
      var t     = (elapsed - tStart) / T_STRIPE_DUR;
      var eased = 1 - Math.pow(1 - t, 3);  // ease-out cubic
      var nomW  = eased * 2100;

      // Each band is ahead or behind the nominal edge by its precomputed offset,
      // creating a stepped bristle-like leading edge across the stripe height.
      bands.forEach(function (b) {
        b.rect.setAttribute('width', String(Math.max(0, nomW + b.off)));
      });
    });

    if (needMore) requestAnimationFrame(paintLoop);
  }

  requestAnimationFrame(paintLoop);

  /* ══════════════════════════════════════════════════════════════════
     REMAINING SEQUENCE  (canton → stars → portrait → logo + grain)
  ══════════════════════════════════════════════════════════════════ */
  // Canton
  setTimeout(function () {
    var canton = document.getElementById('canton');
    canton.style.transition = 'opacity ' + T_CANTON_DUR + 'ms ease';
    canton.style.opacity    = '1';
  }, T_CANTON_DELAY);

  // Stars — staggered fade-in
  starEls.forEach(function (star, i) {
    setTimeout(function () {
      star.style.transition = 'opacity 480ms ease';
      star.style.opacity    = '1';
    }, T_STARS_START + i * T_STAR_STAGGER);
  });

  // Portrait
  setTimeout(function () {
    document.getElementById('portrait').style.opacity = '1';
  }, T_PORTRAIT_DELAY);

  // Logo + grain
  setTimeout(function () {
    document.getElementById('logo').style.opacity  = '1';
    document.getElementById('grain').style.opacity = '0.038';
  }, T_LOGO_DELAY);

})();
</script>

</body>
</html>
