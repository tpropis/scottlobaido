<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scott LoBaido — American Artist</title>
  <style>
    /* ─── RESET ─────────────────────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* ─── STAGE ─────────────────────────────────────────────────────────── */
    .hero {
      position: relative;
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: #000;
    }

    /* ─── FLAG ───────────────────────────────────────────────────────────── */
    /* Slightly oversized + rotated for cinematic drama */
    .flag-wrap {
      position: absolute;
      inset: 0;
      transform: scale(1.08) rotate(-1.3deg);
      transform-origin: 54% 50%;
    }
    .flag-svg {
      width: 100%; height: 100%;
    }

    /* ─── CINEMATIC OVERLAYS ─────────────────────────────────────────────── */
    /* Vignette: dark edges, open center-right where Scott stands */
    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          ellipse 80% 100% at 58% 50%,
          transparent 5%,
          rgba(0,0,0,0.42) 55%,
          rgba(0,0,0,0.84) 100%
        ),
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.50) 0%,
          transparent 22%,
          transparent 72%,
          rgba(0,0,0,0.70) 100%
        );
      z-index: 2;
      pointer-events: none;
    }

    /* Animated film grain overlay */
    #grain {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      opacity: 0;
      z-index: 8;
      pointer-events: none;
      mix-blend-mode: overlay;
      background-repeat: repeat;
      background-size: 256px 256px;
      transition: opacity 2.5s ease;
      animation: grain-shift 0.13s steps(1) infinite;
    }
    @keyframes grain-shift {
      0%   { background-position:   0px   0px; }
      14%  { background-position: -35px  48px; }
      28%  { background-position:  52px -30px; }
      42%  { background-position: -22px  65px; }
      57%  { background-position:  45px -48px; }
      71%  { background-position: -60px  24px; }
      85%  { background-position:  28px -58px; }
    }

    /* ─── PORTRAIT ───────────────────────────────────────────────────────── */
    .portrait {
      position: absolute;
      right: 5%;
      bottom: 0;
      height: 93vh;
      max-height: 960px;
      width: auto;
      opacity: 0;
      z-index: 5;
      /* Strong left-side shadow to root him in the scene; warm edge-light hint */
      filter:
        drop-shadow(-35px  0px 55px rgba(0,0,0,0.96))
        drop-shadow( -8px  0px 18px rgba(178,34,52, 0.12));
      transition: opacity 2.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ─── LOGO ───────────────────────────────────────────────────────────── */
    .logo {
      position: absolute;
      left: 5%;
      bottom: 8%;
      width: clamp(210px, 27vw, 350px);
      opacity: 0;
      z-index: 6;
      filter: drop-shadow(0 0 35px rgba(0,0,0,1));
      transition: opacity 2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ─── MOBILE ─────────────────────────────────────────────────────────── */
    @media (max-width: 680px) {
      .flag-wrap { transform: scale(1.1) rotate(-1.3deg); }

      .portrait {
        right: 50%;
        transform: translateX(50%);
        height: 70vh;
        bottom: 22vh;
        filter: drop-shadow(0 0 40px rgba(0,0,0,0.9));
      }
      .logo {
        left: 50%;
        bottom: 4%;
        transform: translateX(-50%);
        width: clamp(180px, 72vw, 300px);
      }
    }
  </style>
</head>
<body>

<div class="hero">

  <!-- ══════════════════════════════════════════════
       FLAG — all animation driven from script
  ══════════════════════════════════════════════ -->
  <div class="flag-wrap">
    <svg id="flag" class="flag-svg"
         viewBox="0 0 1900 1000"
         preserveAspectRatio="xMidYMid slice"
         xmlns="http://www.w3.org/2000/svg">
      <defs>

        <!--
          Brush-texture filter for red stripes.
          feTurbulence generates fractal noise;
          feDisplacementMap samples the stripe color at displaced coords,
          creating ragged horizontal edges (top/bottom of each stripe)
          that read as brushstroke texture.
        -->
        <filter id="tex-r"
                x="-1%" y="-14%"
                width="102%" height="128%"
                color-interpolation-filters="linearRGB">
          <feTurbulence type="fractalNoise"
                        baseFrequency="1.15 0.032"
                        numOctaves="4" seed="5" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n"
                             scale="10"
                             xChannelSelector="R" yChannelSelector="G"
                             result="d"/>
          <feComposite in="d" in2="SourceGraphic" operator="in"/>
        </filter>

        <!-- Lighter version for cream/white stripes -->
        <filter id="tex-w"
                x="-1%" y="-14%"
                width="102%" height="128%"
                color-interpolation-filters="linearRGB">
          <feTurbulence type="fractalNoise"
                        baseFrequency="1.15 0.032"
                        numOctaves="4" seed="11" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n"
                             scale="5"
                             xChannelSelector="R" yChannelSelector="G"
                             result="d"/>
          <feComposite in="d" in2="SourceGraphic" operator="in"/>
        </filter>

      </defs>

      <!--
        13 STRIPES — alternating red/cream, starting red.
        Exact height = 1000/13 = 76.9231...
        Each stripe gets +2 units of height to overlap the next and
        prevent hairline gaps caused by the displacement filter.
        Rendered in order so each stripe covers the overlap above.
      -->
      <rect id="s0"  x="0" y="0"       width="1900" height="78.924" fill="#B22234" filter="url(#tex-r)"/>
      <rect id="s1"  x="0" y="76.923"  width="1900" height="78.924" fill="#EDE5CC" filter="url(#tex-w)"/>
      <rect id="s2"  x="0" y="153.846" width="1900" height="78.924" fill="#B22234" filter="url(#tex-r)"/>
      <rect id="s3"  x="0" y="230.769" width="1900" height="78.924" fill="#EDE5CC" filter="url(#tex-w)"/>
      <rect id="s4"  x="0" y="307.692" width="1900" height="78.924" fill="#B22234" filter="url(#tex-r)"/>
      <rect id="s5"  x="0" y="384.615" width="1900" height="78.924" fill="#EDE5CC" filter="url(#tex-w)"/>
      <rect id="s6"  x="0" y="461.538" width="1900" height="78.924" fill="#B22234" filter="url(#tex-r)"/>
      <rect id="s7"  x="0" y="538.462" width="1900" height="78.924" fill="#EDE5CC" filter="url(#tex-w)"/>
      <rect id="s8"  x="0" y="615.385" width="1900" height="78.924" fill="#B22234" filter="url(#tex-r)"/>
      <rect id="s9"  x="0" y="692.308" width="1900" height="78.924" fill="#EDE5CC" filter="url(#tex-w)"/>
      <rect id="s10" x="0" y="769.231" width="1900" height="78.924" fill="#B22234" filter="url(#tex-r)"/>
      <rect id="s11" x="0" y="846.154" width="1900" height="78.924" fill="#EDE5CC" filter="url(#tex-w)"/>
      <rect id="s12" x="0" y="923.077" width="1900" height="76.923" fill="#B22234" filter="url(#tex-r)"/>

      <!--
        CANTON (union) — exactly 7 stripes tall × 2/5 flag wide.
        7 × (1000/13) = 538.461...   width = 2/5 × 1900 = 760
        Starts fully transparent; fades in after stripes complete.
      -->
      <rect id="canton"
            x="0" y="0"
            width="760" height="538.462"
            fill="#3C3B6E"
            opacity="0"/>

      <!-- 50 STARS — generated and positioned by script -->
      <g id="stars"></g>

    </svg>
  </div>

  <!-- Cinematic overlays -->
  <div class="vignette"></div>
  <div id="grain"></div>

  <!-- Scott's portrait (transparent-bg PNG) -->
  <img class="portrait" id="portrait"
       src="scott.png"
       alt="Scott LoBaido" />

  <!-- Logo -->
  <img class="logo" id="logo"
       src="logo.png"
       alt="American Artist Scott LoBaido" />

</div><!-- /.hero -->


<script>
(function () {
  'use strict';

  /* ─── CONSTANTS ────────────────────────────────────────────────────── */
  var SVG_NS = 'http://www.w3.org/2000/svg';

  /* ─── FILM GRAIN ───────────────────────────────────────────────────── */
  // Build a random noise tile on an off-screen canvas, convert to data URL,
  // then apply as a repeating background on #grain for the film-grain look.
  (function buildGrain() {
    var SIZE = 256;
    var c    = document.createElement('canvas');
    c.width  = SIZE;
    c.height = SIZE;
    var ctx  = c.getContext('2d');
    var img  = ctx.createImageData(SIZE, SIZE);
    var d    = img.data;
    for (var i = 0; i < d.length; i += 4) {
      var v    = (Math.random() * 255) | 0;
      d[i]     = v;
      d[i + 1] = v;
      d[i + 2] = v;
      d[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    document.getElementById('grain').style.backgroundImage =
      'url(' + c.toDataURL() + ')';
  })();

  /* ─── STAR GENERATION ──────────────────────────────────────────────── */
  //
  // Official US flag star grid (derived from EO 10834 geometry):
  //
  //   Canton: 760 wide × 538.462 tall (in our 1900×1000 viewBox)
  //
  //   The 50 stars sit on a 12-column × 10-row grid:
  //     Horizontal grid unit  GH = 760 / 12  = 63.333
  //     Vertical   grid unit  GV = 538.462 / 10 = 53.846
  //
  //   Row 0,2,4,6,8 (5 rows) → 6 stars at x = GH × {1,3,5,7,9,11}
  //   Row 1,3,5,7   (4 rows) → 5 stars at x = GH × {2,4,6,8,10}
  //   All rows               → y = GV × (row + 1)
  //
  //   Total: 5×6 + 4×5 = 30 + 20 = 50 ✓
  //
  var CANTON_W = 760;
  var CANTON_H = 7 * (1000 / 13);          // 538.4615...
  var GH       = CANTON_W / 12;            // 63.333...
  var GV       = CANTON_H / 10;            // 53.846...
  var STAR_R   = 22;                        // outer-point radius

  // 6-star row x multipliers (odd columns on the 12-col grid)
  var SIX_X = [1, 3, 5, 7, 9, 11];
  // 5-star row x multipliers (even columns)
  var FIVE_X = [2, 4, 6, 8, 10];

  function starPath(cx, cy) {
    // Builds a filled 5-pointed star polygon.
    // Outer points every 72° starting at -90° (tip up).
    // Inner points at +36° offset, radius = R × 0.382 (sin18°/sin54°).
    var R  = STAR_R;
    var ri = R * 0.382;
    var d  = '';
    for (var i = 0; i < 5; i++) {
      var oa = (i * 72 - 90) * (Math.PI / 180);
      var ia = (i * 72 - 54) * (Math.PI / 180);
      d += (i === 0 ? 'M' : 'L') +
           (cx + R  * Math.cos(oa)).toFixed(2) + ',' +
           (cy + R  * Math.sin(oa)).toFixed(2) + 'L' +
           (cx + ri * Math.cos(ia)).toFixed(2) + ',' +
           (cy + ri * Math.sin(ia)).toFixed(2);
    }
    return d + 'Z';
  }

  var starsGroup = document.getElementById('stars');
  var starEls    = [];

  for (var row = 0; row < 9; row++) {
    var isSixRow = (row % 2 === 0);
    var xMults   = isSixRow ? SIX_X : FIVE_X;
    var starY    = GV * (row + 1);

    for (var xi = 0; xi < xMults.length; xi++) {
      var starX = GH * xMults[xi];
      var path  = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('d',       starPath(starX, starY));
      path.setAttribute('fill',    '#FFFFFF');
      path.setAttribute('opacity', '0');
      starsGroup.appendChild(path);
      starEls.push(path);
    }
  }
  // Sanity check — remove in production
  // console.assert(starEls.length === 50, 'Expected 50 stars, got ' + starEls.length);

  /* ─── HIDE STRIPES BEFORE FIRST PAINT ──────────────────────────────── */
  // Setting clip-path synchronously before the browser paints ensures
  // stripes start fully invisible (not flashing their full color for one frame).
  var stripes = [];
  for (var si = 0; si < 13; si++) {
    var s = document.getElementById('s' + si);
    s.style.clipPath = 'inset(0 100% 0 0)';
    stripes.push(s);
  }

  /* ─── TIMING (all values in milliseconds) ───────────────────────────── */
  var T_STRIPE_START   = 500;   // pause before first stripe begins
  var T_STRIPE_STAGGER = 188;   // delay between each stripe start
  var T_STRIPE_DUR     = 730;   // each stripe's reveal duration

  // Canton starts after last stripe finishes + short gap
  var T_CANTON_DELAY   = T_STRIPE_START + 12 * T_STRIPE_STAGGER + T_STRIPE_DUR + 120;
  var T_CANTON_DUR     = 900;

  // Stars begin ~400 ms after canton starts (overlap intentional)
  var T_STARS_START    = T_CANTON_DELAY + 420;
  var T_STAR_STAGGER   = 42;

  // Portrait fades in after ~10 stars are visible (don't wait for all 50)
  var T_PORTRAIT_DELAY = T_STARS_START + 350;
  var T_PORTRAIT_DUR   = 2400; // CSS transition set in stylesheet

  // Logo comes in after portrait is mostly visible
  var T_LOGO_DELAY     = T_PORTRAIT_DELAY + 820;

  /* ─── ANIMATION SEQUENCE ────────────────────────────────────────────── */

  // 1. STRIPES — clip-path reveals each stripe left→right
  stripes.forEach(function (s, i) {
    setTimeout(function () {
      s.style.transition =
        'clip-path ' + T_STRIPE_DUR + 'ms cubic-bezier(0.22, 0.61, 0.36, 1)';
      s.style.clipPath = 'inset(0 0% 0 0)';
    }, T_STRIPE_START + i * T_STRIPE_STAGGER);
  });

  // 2. CANTON — fades in
  setTimeout(function () {
    var canton = document.getElementById('canton');
    canton.style.transition = 'opacity ' + T_CANTON_DUR + 'ms ease';
    canton.style.opacity    = '1';
  }, T_CANTON_DELAY);

  // 3. STARS — staggered fade-in
  starEls.forEach(function (star, i) {
    setTimeout(function () {
      star.style.transition = 'opacity 500ms ease';
      star.style.opacity    = '1';
    }, T_STARS_START + i * T_STAR_STAGGER);
  });

  // 4. PORTRAIT — fades in
  setTimeout(function () {
    document.getElementById('portrait').style.opacity = '1';
  }, T_PORTRAIT_DELAY);

  // 5. LOGO + grain — fades in last
  setTimeout(function () {
    document.getElementById('logo').style.opacity  = '1';
    document.getElementById('grain').style.opacity = '0.038';
  }, T_LOGO_DELAY);

})();
</script>

</body>
</html>
